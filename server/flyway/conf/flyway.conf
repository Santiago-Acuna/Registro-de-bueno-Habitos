# --- Connection ---
flyway.url=${DB_URL}
flyway.user=${DB_USER}
flyway.password=${DB_PASSWORD}

# --- Scope ---
flyway.schemas=public
# (Optional) if your DB uses more schemas, list them comma-separated.

# --- Locations of migration files ---
flyway.locations=flyway/sql

# --- Safety ---
flyway.cleanDisabled=true
flyway.connectRetries=10

# --- Conventions (defaults shown for clarity) ---
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# --- Baseline settings (we'll use these in step 3) ---
flyway.baselineVersion=1
flyway.baselineDescription=baseline_existing_schema
